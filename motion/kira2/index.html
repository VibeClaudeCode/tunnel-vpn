<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#11131c; --fg:#fff; --ink:#211d2b; --accent:#FFD23F; --red:#E5304A; --blue:#2F5BEA; --green:#27C46B;
          --font-display:"Rubik"; --font-text:"Onest"; }
  #stage { color:var(--fg); font-family:var(--font-text), sans-serif; }
  .bg { background:var(--bg); }
  .scene svg.art { position:absolute; inset:0; width:100%; height:100%; }
  .abs { position:absolute; }
  /* субтитры как в референсе: белые капсом, толстая тёмная обводка */
  #cap { position:absolute; left:50px; right:50px; top:1110px; height:280px; z-index:50;
         font:900 92px/1.02 var(--font-display); text-transform:uppercase; letter-spacing:-.01em; color:#fff; }
  #cap span { -webkit-text-stroke:16px var(--ink); paint-order:stroke fill; filter:drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
  #cap span.hl { color:var(--accent); }
  #cap span.hr { color:#ff5468; }
  /* речевые пузыри с биркой имени */
  .bub { position:absolute; background:#fff; color:var(--ink); border:7px solid var(--ink); border-radius:34px;
         padding:26px 38px; font:800 64px/1.05 var(--font-display); box-shadow:0 10px 0 rgba(0,0,0,.25); white-space:nowrap; }
  .bub .tag { position:absolute; top:-34px; left:26px; font:800 30px/1 var(--font-display); letter-spacing:.06em;
              background:#7b4dff; color:#fff; border:5px solid var(--ink); border-radius:14px; padding:8px 14px; }
  .bub .tail { position:absolute; bottom:-40px; width:50px; height:50px; background:#fff; border-right:7px solid var(--ink); border-bottom:7px solid var(--ink); transform:rotate(45deg) skew(10deg,10deg); }
  /* телефон: экран чата */
  .scr { position:absolute; overflow:hidden; background:#eef1f7; color:#1b1d26; font-family:var(--font-text); }
  .scr .bar { display:flex; justify-content:space-between; padding:22px 44px 0; font:700 30px/1 var(--font-text); }
  .scr .head { display:flex; align-items:center; gap:22px; padding:24px 30px 22px; background:#fff; border-bottom:2px solid #dde2ea; }
  .scr .ava { width:96px; height:96px; border-radius:50%; background:#8e5bff; color:#fff; display:grid; place-items:center; font:900 40px/1 var(--font-display); border:4px solid var(--ink); }
  .scr .ttl { font:800 46px/1.05 var(--font-display); }
  .scr .sub { font:500 30px/1.2 var(--font-text); color:#6a7385; }
  .msg { position:absolute; left:30px; max-width:520px; background:#fff; border-radius:30px 30px 30px 8px; padding:18px 24px; font:500 34px/1.25 var(--font-text); box-shadow:0 3px 0 #d4d9e3; }
  .msg b { display:block; font:700 26px/1.2 var(--font-text); margin-bottom:6px; }
  .react { position:absolute; display:flex; align-items:center; gap:10px; background:#fff; border:4px solid var(--ink); border-radius:40px; padding:8px 22px 8px 12px; font:900 44px/1 var(--font-display); color:var(--ink); }
  .stamp { position:absolute; border:12px solid var(--red); color:var(--red); font:900 150px/1 var(--font-display); padding:10px 40px; border-radius:24px; transform:rotate(-12deg); background:rgba(255,255,255,.85); }
  .card { position:absolute; border:8px solid var(--ink); border-radius:30px; padding:30px 34px; box-shadow:0 14px 0 rgba(0,0,0,.3); }
  .card h3 { margin:0; font:900 66px/1 var(--font-display); text-transform:uppercase; color:#fff; }
  .card p { margin:16px 0 0; font:600 36px/1.2 var(--font-text); color:#fff; opacity:.95; }
  .card .n { position:absolute; top:-44px; right:-30px; width:96px; height:96px; border-radius:50%; background:#fff; color:var(--ink); border:7px solid var(--ink); display:grid; place-items:center; font:900 56px/1 var(--font-display); }
  .pill { position:absolute; background:var(--ink); color:#fff; font:800 42px/1 var(--font-display); border-radius:16px; padding:16px 26px; letter-spacing:.03em; white-space:nowrap; }
  .notif { position:absolute; left:70px; width:780px; background:rgba(255,255,255,.88); color:#1b1d26; border-radius:30px; padding:22px 28px; font:500 32px/1.25 var(--font-text); }
  .notif b { font:700 30px/1.2 var(--font-text); display:block; }
</style>
</head>
<body>
<div id="stage" data-width="1080" data-height="1920" data-fps="30" data-duration="50" data-safe="social" data-sfx="02">
  <div class="bg" data-bg></div>
  <section class="scene" id="s0"></section>
  <section class="scene" id="s1"></section>
  <section class="scene" id="s2"></section>
  <section class="scene" id="s3"></section>
  <section class="scene" id="s4"></section>
  <section class="scene" id="s5"></section>
  <section class="scene" id="s6"></section>
  <section class="scene" id="s7"></section>
  <section class="scene" id="s8"></section>
  <section class="scene" id="s8b"></section>
  <section class="scene" id="s9"></section>
  <section class="scene" id="s10"></section>
  <div id="cap"></div>
</div>
<audio src="media/vo_a.mp3" data-at="0.6" data-voice></audio>
<script src="lib/gsap.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<script src="lib/MotionPathPlugin.min.js"></script>
<script src="lib/MorphSVGPlugin.min.js"></script>
<script src="motion.js"></script>
<script src="data.js"></script>
<script src="js/words.js"></script>
<script src="js/chars.js"></script>
<script src="js/scenes.js"></script>
<script src="js/timeline.js"></script>
</body>
</html>
