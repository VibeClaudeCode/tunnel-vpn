<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="horror.css">
<style>
  #cap { font-size:80px; }
  .note { position:absolute; left:160px; top:1080px; width:760px; padding:50px 54px; background:#EFE6D2; transform:rotate(-3deg); box-shadow:0 20px 40px rgba(0,0,0,.6);
          font:400 70px/1.1 "Marck Script"; color:#2A2620; }
  .cctv { position:absolute; left:60px; right:60px; top:320px; height:1080px; border:8px solid #2A2D36; overflow:hidden; }
</style>
</head>
<body>
<div id="stage" data-width="1080" data-height="1920" data-fps="30" data-duration="45.6" data-safe="none" data-sfx="02">
  <div class="bg" data-bg></div>

  <svg width="0" height="0" style="position:absolute"><defs>
    <g id="hall"><!-- прихожая с антресолями -->
      <rect width="1080" height="1920" fill="#14130F"/>
      <rect x="120" y="200" width="840" height="300" fill="#2A2420" stroke="#1A1714" stroke-width="12"/><line x1="540" y1="200" x2="540" y2="500" stroke="#1A1714" stroke-width="10"/>
      <rect x="500" y="320" width="80" height="40" rx="6" fill="#6A5A40"/>
      <rect x="300" y="620" width="480" height="1000" fill="#3A2E24" stroke="#241D18" stroke-width="14"/><circle cx="720" cy="1120" r="18" fill="#9A8A70"/>
      <rect y="1620" width="1080" height="300" fill="#0E0C0A"/>
    </g>
    <g id="key"><circle r="50" fill="none" stroke="#C9B37A" stroke-width="16"/><rect x="40" y="-10" width="200" height="20" fill="#C9B37A"/><rect x="190" y="10" width="16" height="40" fill="#C9B37A"/><rect x="220" y="10" width="16" height="30" fill="#C9B37A"/></g>
  </defs></svg>

  <!-- 0. Вспышка: антресоль приоткрыта -->
  <section class="scene" id="sZ">
    <svg class="art" viewBox="0 0 1080 1920"><use href="#hall"/><rect x="540" y="206" width="414" height="288" fill="#000"/><circle cx="700" cy="350" r="10" fill="#E8E0D0"/><circle cx="740" cy="350" r="10" fill="#E8E0D0"/><rect width="1080" height="1920" fill="#E23B3B" opacity=".18"/></svg>
  </section>

  <!-- A. Курьер, коробка -->
  <section class="scene" id="sA">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0A0A0C"/>
      <g id="box"><rect x="320" y="760" width="440" height="340" fill="#B8935F"/><rect x="320" y="760" width="440" height="60" fill="#A8834F"/><rect x="520" y="760" width="40" height="340" fill="#D7C39A" opacity=".6"/>
        <rect x="380" y="880" width="240" height="140" fill="#F4F1EA"/><g fill="#2A2620"><rect x="400" y="900" width="160" height="12"/><rect x="400" y="930" width="190" height="12"/><rect x="400" y="960" width="120" height="12"/></g></g>
      <g id="keyA" transform="translate(420,920)" opacity="0"><use href="#key"/></g></svg>
    <div class="tag" data-small id="aName" style="top:520px"><i></i>ВАДИМ · ЕГО АДРЕС · ОПЛАЧЕНО</div>
    <div class="note" id="note">«Чтобы ты больше не оставлял дверь открытой»</div>
  </section>

  <!-- B. Он всегда запирает: замок, 2 оборота -->
  <section class="scene" id="sB">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0C0B09"/>
      <rect x="240" y="420" width="600" height="1100" fill="#3A2E24" stroke="#241D18" stroke-width="14"/>
      <g transform="translate(540,960)"><rect x="-80" y="-120" width="160" height="240" rx="20" fill="#7A6A50"/><circle id="lockC" r="40" fill="#2A2620"/><rect id="lockK" x="-8" y="-30" width="16" height="60" fill="#C9B37A"/></g></svg>
    <div class="big" id="bTurns" style="top:250px;font-size:140px;color:#C9C3B6">2 оборота</div>
  </section>

  <!-- C. Камера в прихожей: 04:10 дверь открывается сама -->
  <section class="scene" id="sC">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#08090A"/></svg>
    <div class="cctv"><svg viewBox="0 0 960 1080" style="width:100%;height:100%;filter:grayscale(1) contrast(1.1)">
      <rect width="960" height="1080" fill="#2A2C30"/>
      <rect x="260" y="160" width="440" height="860" fill="#0A0A0C"/>
      <g id="doorC"><rect x="260" y="160" width="440" height="860" fill="#4A4C50" stroke="#1E2024" stroke-width="12"/><circle cx="640" cy="600" r="16" fill="#8A8C90"/></g>
      <g id="scan" fill="#fff" opacity=".05"></g></svg>
      <div class="mono" style="left:24px;top:24px;color:#fff">CAM 01 · ПРИХОЖАЯ · <span id="ts">04:09:58</span></div></div>
    <div class="tag red" data-small id="cIn" style="top:1460px"><i></i>ЗАКРЫЛАСЬ ИЗНУТРИ</div>
  </section>

  <!-- D. Антресоль -->
  <section class="scene" id="sD">
    <svg class="art" viewBox="0 0 1080 1920"><use href="#hall"/><rect id="gap" x="538" y="206" width="4" height="288" fill="#000"/></svg>
    <div class="tag" data-small id="dAll" style="top:1680px"><i></i>КАЖДЫЙ УГОЛ ПРОВЕРЕН</div>
    <div class="tag red" data-small id="dLock" style="top:560px"><i></i>ВСЕГДА БЫЛ ЗАПЕРТ</div>
  </section>

  <div id="cap"></div>
  <div id="vign"></div>
  <div id="flick"></div>
</div>
<audio src="media/voice.mp3" data-at="1" data-voice></audio>
<script src="lib/gsap.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<script src="lib/MotionPathPlugin.min.js"></script>
<script src="lib/MorphSVGPlugin.min.js"></script>
<script src="motion.js"></script>
<script src="data.js"></script>
<script src="caps.js"></script>
<script>
M.start(({ tl, D }) => {
  const W = M.data.words.s17;
  const nrm = s => s.toLowerCase().replace(/[^а-яё0-9]/g, '');
  const wt = (s, n = 1, end) => { let k = 0; for (const w of W) if ((nrm(s).length <= 3 ? nrm(w.w) === nrm(s) : nrm(w.w).startsWith(nrm(s))) && ++k === n) return end ? w.e : w.s; console.warn('нет слова', s); return 0; };
  const T = { A: .95, B: wt('вадим', 2) - .3, C: wt('поставил') - .3, D: wt('живёт') - .3 };
  xfade(tl, [['#sZ',0],['#sA',T.A],['#sB',T.B],['#sC',T.C],['#sD',T.D],], D, .2);
  captions(W, { k1: [], k2: [], k3: ['не','делал.','ключ.','квартиры.','открытой».','сама','изнутри.','один.','кроме','антресолях.','заперт.'], k4: [] });
  M.sfx('boom', .02); M.sfx('ding', .05, { gain: -2 }); M.sfx('glitch', .9, { gain: -4 });
  M.onFrame(t => { const f = document.querySelector('#flick'); let o = 0;
    for (const a of [T.A, T.B, T.C, T.D]) if (t > a - .05 && t < a + .4) o = Math.max(o, (Math.sin((t - a) * 90) > 0 ? .85 : .15) * (1 - (t - a + .05) / .45));
    f.style.opacity = o; });
  for (const s of [T.A, T.B, T.C, T.D]) M.sfx('swell', s + .1, { gain: -10, rate: .6 });

  // A — коробка, ключ, записка
  tl.fromTo('#box', { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .6, ease: 'expo.out' }, T.A); M.sfx('thud', T.A + .4);
  M.show('#aName', { at: wt('имя') - .2, in: 'pop', dur: .45 });
  M.hide('#aName', { at: wt('внутри') - .3, out: 'fade', dur: .3 });
  tl.to('#box', { y: 300, opacity: .25, duration: .6, ease: 'power2.in' }, wt('внутри') - .2);
  tl.fromTo('#keyA', { y: 200, opacity: 0 }, { y: -320, opacity: 1, duration: .7, ease: 'expo.out' }, wt('ключ') - .3); M.sfx('ping', wt('ключ'), { gain: -6 });
  M.hit(wt('квартиры'), 'm');
  M.show('#note', { at: wt('записка') - .1, in: 'blur', dur: .8 }); M.sfx('scratch', wt('записка'));

  // B — замок
  [wt('всегда') , wt('всегда', 2), wt('два')].forEach(k => { M.sfx('click', k); });
  tl.to('#lockK', { rotation: 720, transformOrigin: '50% 50%', duration: 1.4, ease: 'power2.inOut' }, wt('два') - .3);
  M.show('#bTurns', { at: wt('два') - .1, in: 'pop', dur: .45 });

  // C — запись
  const sc = document.querySelector('#scan'), SC = [];
  for (let i = 0; i < 30; i++) SC.push(mk(sc, 'rect', { x: 0, width: 960, height: 3 }));
  const op = wt('открывается') - .3, cl = wt('закрывается') - .1;
  M.onFrame(t => { SC.forEach((r, i) => r.setAttribute('y', (i * 37 + t * 120) % 1080));
    const base = 4 * 3600 + 9 * 60 + 58, s = base + Math.max(0, t - wt('четыре')) * (t < cl ? 1 : 20);
    document.querySelector('#ts').textContent = `0${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`; });
  gsap.set('#doorC', { transformOrigin: '260px 590px' });
  tl.to('#doorC', { scaleX: .35, duration: 1.4, ease: 'power2.inOut' }, op); M.sfx('scratch', op, { rate: .6 });
  tl.to('#doorC', { scaleX: 1, duration: 1, ease: 'power2.inOut' }, cl); M.sfx('thud', cl + 1);
  M.sfx('click', wt('замок') + .2);
  M.show('#cIn', { at: wt('изнутри') - .2, in: 'blur', dur: .6 }); M.hit(wt('изнутри'), 'l');

  // D — антресоль
  M.show('#dAll', { at: wt('угол') - .3, in: 'fade', dur: .5 });
  tl.to('#sD svg.art', { scale: 1.9, transformOrigin: '50% 18%', duration: 2.2, ease: 'power2.inOut' }, wt('кроме') - .4);
  M.show('#dLock', { at: wt('заперт') - .6, in: 'blur', dur: .6 });
  tl.to('#gap', { attr: { width: 30 }, duration: 1.4, ease: 'power1.in' }, wt('заперт') + .2); M.sfx('scratch', wt('заперт') + .3, { rate: .5 });
  M.hit(wt('заперт') + 1.2, 'l');
  M.grain(0.16);
});
</script>
</body>
</html>
