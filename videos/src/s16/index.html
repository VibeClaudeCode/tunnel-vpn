<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="horror.css">
<style>
  .chat { position:absolute; left:90px; right:90px; top:260px; height:1180px; border-radius:40px; background:#0D1017; border:6px solid #1C202A; overflow:hidden; }
  .chat .hd { padding:30px 40px; border-bottom:3px solid #1C202A; font:800 42px/1.2 "Montserrat"; color:#E8E6E0; }
  .msg { position:absolute; max-width:640px; padding:26px 34px; border-radius:34px; font:700 40px/1.25 "Montserrat"; color:#E8E6E0; }
  .msg.in { left:40px; background:#1E2433; } .msg.out { right:40px; background:#2A3F66; }
  .photo { position:absolute; right:40px; width:460px; height:600px; border-radius:24px; overflow:hidden; border:4px solid #2A3F66; }
</style>
</head>
<body>
<div id="stage" data-width="1080" data-height="1920" data-fps="30" data-duration="47.6" data-safe="none" data-sfx="02">
  <div class="bg" data-bg></div>

  <svg width="0" height="0" style="position:absolute"><defs>
    <g id="selfie"><!-- селфи 460×600: Лена, руки на столе, шкаф с щелью -->
      <rect width="460" height="600" fill="#2A2632"/>
      <rect x="40" y="40" width="200" height="420" fill="#3A3028" stroke="#241D18" stroke-width="6"/><line x1="140" y1="40" x2="140" y2="460" stroke="#241D18" stroke-width="6"/>
      <rect id="crackS" x="138" y="80" width="8" height="340" fill="#050507"/><circle id="eyeS" cx="142" cy="200" r="5" fill="#E8E0D0"/>
      <rect y="460" width="460" height="140" fill="#4A3A2C"/>
      <ellipse cx="300" cy="300" rx="80" ry="96" fill="#D9B9A0"/><path d="M220,290 Q220,190 300,186 Q380,190 380,290 L380,250 Q300,200 220,250 Z" fill="#3A2418"/>
      <circle cx="275" cy="300" r="7" fill="#1A1A1E"/><circle cx="325" cy="300" r="7" fill="#1A1A1E"/>
      <path d="M200,560 Q200,400 300,392 Q400,400 400,560 Z" fill="#8A5A7A"/>
      <g id="hands" fill="#D9B9A0"><ellipse cx="230" cy="480" rx="40" ry="22"/><ellipse cx="370" cy="480" rx="40" ry="22"/></g>
    </g>
  </defs></svg>

  <!-- 0. Вспышка: глаз в щели шкафа -->
  <section class="scene" id="sZ">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#050507"/><rect x="500" y="300" width="80" height="1300" fill="#000"/>
      <rect x="0" y="0" width="500" height="1920" fill="#3A3028"/><rect x="580" y="0" width="500" height="1920" fill="#3A3028"/>
      <ellipse cx="540" cy="900" rx="34" ry="22" fill="#E8E0D0"/><circle cx="540" cy="900" r="14" fill="#2A3A30"/><circle cx="540" cy="900" r="7" fill="#000"/>
      <rect width="1080" height="1920" fill="#E23B3B" opacity=".18"/></svg>
  </section>

  <!-- A. Чат с мамой -->
  <section class="scene" id="sA">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#040506"/></svg>
    <div class="chat" id="chatA"><div class="hd">Мама</div>
      <div class="photo" id="ph" style="top:140px"><svg viewBox="0 0 460 600" style="width:100%;height:100%"><use href="#selfie"/></svg></div>
      <div class="msg in" id="mQ" style="top:800px">Кто это стоит у тебя за спиной?</div>
    </div>
  </section>

  <!-- C. Увеличение: щель и глаз -->
  <section class="scene" id="sC">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#040506"/>
      <g id="zoomG" transform="translate(540,960) scale(2.2) translate(-230,-300)"><use href="#selfie"/></g></svg>
    <div class="tag red" data-small id="cEye" style="top:220px"><i></i>ДВЕРЦА ПРИОТКРЫТА · ГЛАЗ</div>
  </section>

  <!-- D. Реальная комната: шкаф закрыт -->
  <section class="scene" id="sD">
    <svg class="art" viewBox="0 0 1080 1920"><defs><radialGradient id="lampD"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".35"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient></defs>
      <rect width="1080" height="1920" fill="#0C0B0E"/><circle cx="700" cy="400" r="700" fill="url(#lampD)"/>
      <rect x="240" y="380" width="600" height="1180" fill="#3A3028" stroke="#241D18" stroke-width="14"/><line x1="540" y1="380" x2="540" y2="1560" stroke="#241D18" stroke-width="12"/>
      <circle cx="510" cy="960" r="14" fill="#9A8A70"/><circle cx="570" cy="960" r="14" fill="#9A8A70"/><rect y="1560" width="1080" height="360" fill="#100E0B"/></svg>
    <div class="tag" data-small id="dShut" style="top:240px"><i></i>ЗАКРЫТ. ПЛОТНО</div>
  </section>

  <!-- E. Звонок маме -->
  <section class="scene" id="sE">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#050507"/>
      <g id="callW" fill="none" stroke="#5BE38B" stroke-width="5"></g></svg>
    <div class="big" style="top:420px;font-size:110px;color:#E8E6E0">Мама</div>
    <div class="mono" id="callT" style="left:460px;top:570px">00:00</div>
    <div class="quote" id="eQ" style="top:1000px;text-align:center;font-size:70px">«Я не про шкаф.<br>Я про того,<br>кто держит телефон»</div>
  </section>

  <!-- F. Снова фото: обе руки на столе -->
  <section class="scene" id="sF">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#040506"/>
      <g transform="translate(540,960) scale(1.9) translate(-230,-300)"><use href="#selfie"/>
        <g fill="none" stroke="#E23B3B" stroke-width="5" id="handRing" opacity="0"><ellipse cx="230" cy="480" rx="56" ry="36"/><ellipse cx="370" cy="480" rx="56" ry="36"/></g>
        <path id="otherHand" d="M460,560 Q420,520 400,470 L430,456 Q450,500 470,520 Z" fill="#B9B2A6" opacity="0"/></g></svg>
    <div class="tag red" data-small id="fHands" style="top:220px"><i></i>ОБЕ РУКИ — НА СТОЛЕ</div>
  </section>

  <div id="cap"></div>
  <div id="vign"></div>
  <div id="flick"></div>
</div>
<audio src="media/voice.mp3" data-at="1" data-voice></audio>
<script src="lib/gsap.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<script src="lib/MotionPathPlugin.min.js"></script>
<script src="lib/MorphSVGPlugin.min.js"></script>
<script src="motion.js"></script>
<script src="data.js"></script>
<script src="caps.js"></script>
<script>
M.start(({ tl, D }) => {
  const W = M.data.words.s16;
  const nrm = s => s.toLowerCase().replace(/[^а-яё0-9]/g, '');
  const wt = (s, n = 1, end) => { let k = 0; for (const w of W) if ((nrm(s).length <= 3 ? nrm(w.w) === nrm(s) : nrm(w.w).startsWith(nrm(s))) && ++k === n) return end ? w.e : w.s; console.warn('нет слова', s); return 0; };
  const T = { A: .95, C: wt('увеличила') - .3, D: wt('обернулась') - .4, E: wt('позвонила') - .3, F: wt('снова') - .5 };
  xfade(tl, [['#sZ',0],['#sA',T.A],['#sC',T.C],['#sD',T.D],['#sE',T.E],['#sF',T.F]], D, .2);
  captions(W, { k1: [], k2: [], k3: ['спиной?»','одна.','пустой','глаз.','никого.','держит','телефон».','другой.','кто-то'], k4: [] });
  M.sfx('boom', .02); M.sfx('notify', .05, { gain: -2 }); M.sfx('glitch', .9, { gain: -4 });
  M.onFrame(t => { const f = document.querySelector('#flick'); let o = 0;
    for (const a of [T.A, T.C, T.D, T.E, T.F]) if (t > a - .05 && t < a + .4) o = Math.max(o, (Math.sin((t - a) * 90) > 0 ? .85 : .15) * (1 - (t - a + .05) / .45));
    f.style.opacity = o; });
  for (const s of [T.A, T.C, T.D, T.E, T.F]) M.sfx('swell', s + .1, { gain: -10, rate: .6 });
  // глаз и щель в селфи скрыты до увеличения
  M.onFrame(t => { const on = t > wt('приоткрыта') - .2 || t < T.A; document.querySelectorAll('#crackS, #eyeS').forEach(e => e.setAttribute('opacity', on ? 1 : 0)); });

  // A
  tl.fromTo('#ph', { y: 60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .5, ease: 'expo.out' }, T.A); M.sfx('swish', T.A);
  tl.fromTo('#mQ', { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .4, ease: 'expo.out' }, T.A + .2); M.sfx('blip', T.A + .25, { gain: -4 });
  M.hit(wt('спиной'), 'l');
  tl.to('#chatA', { scale: 1.12, transformOrigin: '70% 30%', duration: T.C - T.A, ease: 'none' }, T.A);

  // C
  tl.fromTo('#zoomG', { attr: { transform: 'translate(540,960) scale(2.2) translate(-230,-300)' } }, { attr: { transform: 'translate(540,960) scale(6) translate(-142,-220)' }, duration: 2.4, ease: 'power3.inOut' }, wt('увеличила'));
  M.sfx('sweep', wt('увеличила'), { gain: -4 });
  M.show('#cEye', { at: wt('глаз') - .1, in: 'pop', dur: .45 }); M.hit(wt('глаз'), 'l');

  // D
  M.show('#dShut', { at: wt('плотно') - .2, in: 'fade', dur: .5 });
  tl.fromTo('#sD svg.art', { scale: 1.2 }, { scale: 1, transformOrigin: '50% 50%', duration: .5, ease: 'expo.out' }, T.D + .1); M.sfx('whoosh', T.D + .1);

  // E
  M.onFrame(t => { const s = Math.max(0, t - wt('позвонила')); document.querySelector('#callT').textContent = '00:' + String(Math.floor(s)).padStart(2, '0'); });
  const cw = document.querySelector('#callW');
  for (let i = 0; i < 3; i++) { const c = mk(cw, 'circle', { cx: 540, cy: 480, r: 10, opacity: 0 }); tl.fromTo(c, { attr: { r: 10 }, opacity: .8 }, { attr: { r: 300 }, opacity: 0, duration: 1.4, ease: 'expo.out' }, wt('позвонила') + i * .5); }
  M.show('#eQ', { at: wt('шкаф', 3) - .6, in: 'blur', dur: .9 }); M.hit(wt('телефон'), 'l');

  // F
  tl.to('#handRing', { opacity: 1, duration: .3 }, wt('руки') - .2); M.show('#fHands', { at: wt('руки') - .2, in: 'pop', dur: .45 });
  tl.to('#otherHand', { opacity: 1, duration: 1.2, ease: 'power1.in' }, wt('другой') - 1); M.hit(wt('другой'), 'l');
  tl.fromTo('#sF svg.art', { scale: 1 }, { scale: 1.25, transformOrigin: '72% 66%', duration: D - T.F - .4, ease: 'power1.in' }, T.F);
  M.grain(0.16);
});
</script>
</body>
</html>
