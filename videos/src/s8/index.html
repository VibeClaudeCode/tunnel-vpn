<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  :root { --bg:#050507; --red:#E23B3B; }
  .scene { background:#050507; }
  #cap { text-shadow:0 4px 0 rgba(0,0,0,.7), 0 0 40px rgba(0,0,0,.9); }
  #cap .k1, #cap .k3 { color:#E23B3B; text-shadow:0 0 24px rgba(226,59,59,.55), 0 4px 0 rgba(0,0,0,.7); }
  .tag { color:#C9C3B6; border-color:#5A544C; box-shadow:none; background:rgba(10,10,12,.7); }
  .tag.red { color:var(--red); border-color:var(--red); box-shadow:0 0 24px rgba(226,59,59,.3); }
  .quote { background:rgba(12,10,10,.88); border-color:#3A3430; font-family:"Marck Script"; font-weight:400; font-size:96px; line-height:1.1; color:#E23B3B; }
  #vign { position:absolute; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.92) 100%); }
  #flick { position:absolute; inset:0; z-index:41; background:#000; opacity:0; pointer-events:none; }
  .grid { position:absolute; left:90px; top:420px; width:900px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .grid div { height:290px; border-radius:12px; background:#1A1D24; }
  .grid .new { background:#07080A; border:4px solid #E23B3B; position:relative; }
  .mono { position:absolute; font:700 34px/1 "JetBrains Mono"; color:#C9C3B6; white-space:nowrap; }
</style>
</head>
<body>
<div id="stage" data-width="1080" data-height="1920" data-fps="30" data-duration="45" data-safe="none" data-sfx="02">
  <div class="bg" data-bg></div>

  <!-- A. Галерея: новое фото -->
  <section class="scene" id="sA">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0B0C10"/></svg>
    <div class="mono" style="left:90px;top:330px;color:#8FA3BF">ГАЛЕРЕЯ · СЕГОДНЯ</div>
    <div class="grid" id="gridA">
      <div class="new" id="newA"></div><div style="background:#2A2F3A"></div><div style="background:#3A3328"></div>
      <div style="background:#26323A"></div><div style="background:#33292E"></div><div style="background:#2C3328"></div>
      <div style="background:#30302A"></div><div style="background:#25292F"></div><div style="background:#2E2A33"></div>
    </div>
  </section>

  <!-- B. Утро: Олег просыпается, свет телефона -->
  <section class="scene" id="sB">
    <svg class="art" viewBox="0 0 1080 1920">
      <defs><radialGradient id="phGlow"><stop offset="0" stop-color="#8FB0E6" stop-opacity=".55"/><stop offset="1" stop-color="#8FB0E6" stop-opacity="0"/></radialGradient></defs>
      <rect width="1080" height="1920" fill="#060709"/>
      <circle cx="540" cy="900" r="520" fill="url(#phGlow)" id="glowB"/>
      <rect x="120" y="1100" width="840" height="300" rx="30" fill="#141720"/><rect x="140" y="1040" width="300" height="120" rx="40" fill="#1E222C"/>
      <path d="M380,1080 Q520,980 700,1060 Q840,1100 900,1140 L900,1220 L380,1220 Z" fill="#232836"/>
      <rect x="470" y="760" width="160" height="300" rx="24" fill="#0B0D12" stroke="#2A2F3A" stroke-width="6"/><rect x="482" y="772" width="136" height="276" rx="16" fill="#9FC0F0"/>
    </svg>
    <div class="tag" data-small id="bTag" style="top:300px"><i></i>07:12 · УТРО</div>
  </section>

  <!-- C. Фото: тёмная комната сверху, кровать, он спит; время 03:14 -->
  <section class="scene" id="sC">
    <svg class="art" viewBox="0 0 1080 1920">
      <rect width="1080" height="1920" fill="#030304"/>
      <g id="photo">
        <rect x="90" y="380" width="900" height="1120" fill="#0F1116"/>
        <rect x="260" y="560" width="560" height="760" rx="24" fill="#1C2029"/>
        <rect x="300" y="590" width="200" height="120" rx="30" fill="#2A3040"/>
        <path d="M290,760 Q540,700 790,760 L790,1290 L290,1290 Z" fill="#262C3A"/>
        <ellipse cx="420" cy="650" rx="60" ry="66" fill="#3A3A40"/><path d="M380,700 Q420,760 520,760 Q640,760 700,860 L700,1150 Q560,1220 420,1150 Z" fill="#30343F"/>
        <rect x="860" y="600" width="100" height="120" fill="#16181F"/><rect x="890" y="630" width="40" height="70" rx="8" fill="#0B0C10"/>
        <rect x="90" y="380" width="900" height="1120" fill="none" stroke="#2A2D36" stroke-width="10"/>
      </g>
    </svg>
    <div class="tag red" data-small id="cTime" style="top:1560px"><i></i>СНИМОК · 03:14</div>
    <div class="tag" data-small id="cAlone" style="top:260px"><i></i>ЖИВЁТ ОДИН</div>
  </section>

  <!-- D. Разрез комнаты: телефон на тумбочке, а снимок сверху — с потолка -->
  <section class="scene" id="sD">
    <svg class="art" viewBox="0 0 1080 1920">
      <rect width="1080" height="1920" fill="#08090C"/>
      <rect x="0" y="300" width="1080" height="30" fill="#1E2028"/><text x="60" y="290" font-family="JetBrains Mono" font-weight="700" font-size="28" fill="#5A5D66">ПОТОЛОК</text>
      <rect x="0" y="1400" width="1080" height="30" fill="#1E2028"/>
      <rect x="180" y="1170" width="560" height="230" rx="18" fill="#1C2029"/><rect x="200" y="1120" width="180" height="70" rx="26" fill="#2A3040"/>
      <path d="M220,1170 Q440,1110 720,1170 Z" fill="#262C3A"/>
      <rect x="800" y="1220" width="160" height="180" fill="#16181F"/>
      <rect x="840" y="1190" width="80" height="30" rx="8" fill="#0B0C10"/>
      <g id="phoneArrow" stroke="#8FA3BF" stroke-width="6" fill="none"><path d="M840,1205 L620,1205"/><path d="M640,1190 L620,1205 L640,1220"/></g>
      <g id="ceil"><circle cx="460" cy="345" r="26" fill="#E23B3B"/><line id="ceilLine" x1="460" y1="370" x2="460" y2="1100" stroke="#E23B3B" stroke-width="8" stroke-dasharray="20 14"/></g>
    </svg>
    <div class="mono" style="left:700px;top:1460px;font-size:28px">ТЕЛЕФОН · ТУМБОЧКА</div>
    <div class="tag red" data-small id="dUp" style="top:420px;left:640px"><i></i>СНЯТО СВЕРХУ</div>
  </section>

  <!-- E. Запись: REC, 8 часов -->
  <section class="scene" id="sE">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#030304"/>
      <rect x="140" y="520" width="800" height="1000" rx="30" fill="#07080A" stroke="#1E2028" stroke-width="8"/>
      <circle id="rec" cx="230" cy="610" r="22" fill="#E23B3B"/></svg>
    <div class="mono" style="left:270px;top:592px;color:#E23B3B">REC</div>
    <div class="big" id="eT" style="top:900px;font-size:180px;color:#C9C3B6;font-family:'JetBrains Mono'">00:00</div>
  </section>

  <!-- F. Просмотр: темнота, на третьем часу шёпот -->
  <section class="scene" id="sF">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#020203"/>
      <rect x="120" y="1380" width="840" height="10" rx="5" fill="#2A2D36"/><rect id="prog" x="120" y="1380" width="10" height="10" rx="5" fill="#E23B3B"/>
      <circle id="head" cx="130" cy="1385" r="18" fill="#E23B3B"/>
      <g id="waveF" fill="#E23B3B"></g></svg>
    <div class="mono" id="fT" style="left:120px;top:1420px">00:00:00 / 08:00:00</div>
    <div class="quote" id="fQ" style="top:520px;text-align:center">«Не спи»</div>
  </section>

  <!-- G. Финал: свет горит -->
  <section class="scene" id="sG">
    <svg class="art" viewBox="0 0 1080 1920">
      <defs><radialGradient id="lampG"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient></defs>
      <rect width="1080" height="1920" fill="#14110C"/>
      <circle id="lampGl" cx="540" cy="500" r="700" fill="url(#lampG)"/>
      <line x1="540" y1="0" x2="540" y2="380" stroke="#222" stroke-width="5"/><path d="M440,380 L640,380 L600,470 L480,470 Z" fill="#3A3024"/><circle cx="540" cy="490" r="26" fill="#FFF3C4"/>
      <rect x="180" y="1170" width="720" height="230" rx="18" fill="#2A241C"/>
      <circle id="ceilDot" cx="860" cy="120" r="10" fill="#E23B3B" opacity="0"/>
    </svg>
    <div class="tag" data-small id="gTag" style="top:1500px"><i></i>СВЕТ ГОРИТ ВСЮ НОЧЬ</div>
  </section>

  <div id="cap"></div>
  <div id="vign"></div>
  <div id="flick"></div>
</div>
<audio src="media/voice.mp3" data-at="0" data-voice></audio>
<script src="lib/gsap.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<script src="lib/MotionPathPlugin.min.js"></script>
<script src="lib/MorphSVGPlugin.min.js"></script>
<script src="motion.js"></script>
<script src="data.js"></script>
<script src="caps.js"></script>
<script>
M.start(({ tl, D }) => {
  const R = M.rand(61), W = M.data.words.s8;
  const nrm = s => s.toLowerCase().replace(/[^а-яё0-9]/g, '');
  const wt = (s, n = 1, end) => { let k = 0; for (const w of W) if ((nrm(s).length <= 3 ? nrm(w.w) === nrm(s) : nrm(w.w).startsWith(nrm(s))) && ++k === n) return end ? w.e : w.s; console.warn('нет слова', s); return 0; };
  const T = { B: wt('олег') - .3, C: wt('тёмная') - .3, D: wt('решил') - .3, E: wt('следующей') - .3, F: wt('утром') - .3, G: wt('олег', 4) - .3 };
  xfade(tl, [['#sA',0],['#sB',T.B],['#sC',T.C],['#sD',T.D],['#sE',T.E],['#sF',T.F],['#sG',T.G]], D, .45);
  captions(W, { k1: [], k2: [], k3: ['фото…','фото','не','делали?','спит.','один.','сверху.','потолка.','шёпот','спи»','свет.','3','14'], k4: [] });

  M.onFrame(t => { const f = document.querySelector('#flick'); let o = 0;
    for (const a of [T.B, T.C, T.D, T.F, T.G]) if (t > a - .05 && t < a + .45) o = Math.max(o, (Math.sin((t - a) * 90) > 0 ? .85 : .15) * (1 - (t - a + .05) / .5));
    f.style.opacity = o; });
  for (const s of [0, T.B, T.C, T.D, T.E, T.F, T.G]) M.sfx('swell', s + .1, { gain: -10, rate: .6 });

  // A
  tl.fromTo('#gridA', { scale: 1, transformOrigin: '16% 12%' }, { scale: 1.9, duration: T.B, ease: 'power2.in' }, 0);
  tl.fromTo('#newA', { opacity: 0 }, { opacity: 1, duration: .1, repeat: 5, yoyo: true }, wt('фото') - .2);
  M.sfx('blip', wt('фото'), { gain: -6 }); M.hit(wt('делали'), 's');

  // B
  M.show('#bTag', { at: T.B + .3, in: 'fade', dur: .5 });
  M.onFrame(t => document.querySelector('#glowB').setAttribute('opacity', t > wt('открыл') ? .9 : .25));
  M.sfx('tap', wt('открыл'));

  // C
  gsap.set('#photo', { transformOrigin: '540px 900px' });
  tl.fromTo('#photo', { scale: 1.6 }, { scale: 1, duration: 1.4, ease: 'power3.out' }, T.C);
  tl.to('#photo', { scale: 1.12, duration: T.D - T.C - 1.4, ease: 'none' }, T.C + 1.4);
  M.show('#cTime', { at: wt('время') - .1, in: 'blur', dur: .6 }); M.hit(wt('14'), 'm');
  M.show('#cAlone', { at: wt('живёт') - .2, in: 'pop', dur: .45 });

  // D
  const sa = document.querySelector('#ceilLine'), SL = 730; gsap.set(sa, { strokeDasharray: '20 14' });
  tl.fromTo('#ceil', { opacity: 0 }, { opacity: 1, duration: .3 }, wt('сверху') - .2);
  tl.fromTo('#ceilLine', { attr: { y2: 370 } }, { attr: { y2: 1100 }, duration: .8, ease: 'expo.out' }, wt('сверху'));
  M.show('#dUp', { at: wt('сверху') + .1, in: 'pop', dur: .45 });
  M.hit(wt('потолка'), 'l');
  tl.to('#sD svg.art', { scale: 1.1, transformOrigin: '43% 20%', duration: T.E - T.D, ease: 'power1.in' }, T.D);

  // E — запись
  M.onFrame(t => { document.querySelector('#rec').setAttribute('opacity', (t * 1.5) % 1 < .5 ? 1 : .2);
    const s = Math.max(0, Math.min(480, (t - T.E - .3) / Math.max(.5, T.F - T.E - .6) * 480)); document.querySelector('#eT').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0'); });
  M.ticks(T.E + .3, { n: 10, gap: .18, rise: false });

  // F — просмотр, шёпот
  const whisper = wt('спи') - .3;
  const p0 = T.F, p1 = whisper;
  M.onFrame(t => { const k = Math.max(0, Math.min(1, (t - p0) / Math.max(.5, p1 - p0))) * (3 / 8) + (t > p1 ? (t - p1) * .002 : 0);
    document.querySelector('#prog').setAttribute('width', 10 + 830 * k); document.querySelector('#head').setAttribute('cx', 130 + 830 * k);
    const s = Math.floor(k * 8 * 3600); document.querySelector('#fT').textContent = `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')} / 08:00:00`; });
  const wf = document.querySelector('#waveF'), bars = [];
  for (let i = 0; i < 40; i++) bars.push(mk(wf, 'rect', { x: 140 + i * 20, y: 1100, width: 10, height: 4, rx: 4 }));
  M.onFrame(t => bars.forEach((b, i) => { const live = t > whisper - .1 && t < whisper + 1.4; const h = live ? 6 + Math.abs(Math.sin(t * 7 + i * .6)) * 120 * Math.exp(-Math.abs(i - 20) / 8) : 3;
    b.setAttribute('height', h); b.setAttribute('y', 1100 - h / 2); }));
  M.show('#fQ', { at: whisper, in: 'blur', dur: .9 }); M.hit(whisper + .2, 'l');

  // G — свет горит
  M.show('#gTag', { at: wt('выключает') - .2, in: 'fade', dur: .6 });
  M.onFrame(t => document.querySelector('#lampGl').setAttribute('opacity', .85 + .15 * Math.sin(t * 11) * (t > D - 2.5 ? 1 : .2)));
  tl.to('#ceilDot', { opacity: 1, duration: .2 }, D - 1.4); M.sfx('ping', D - 1.4, { gain: -12, rate: .6 });
  M.grain(0.16);
});
</script>
</body>
</html>
