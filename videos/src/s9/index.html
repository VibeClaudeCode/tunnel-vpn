<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  :root { --bg:#050507; --red:#E23B3B; }
  .scene { background:#050507; }
  #cap { text-shadow:0 4px 0 rgba(0,0,0,.7), 0 0 40px rgba(0,0,0,.9); }
  #cap .k1, #cap .k3 { color:#E23B3B; text-shadow:0 0 24px rgba(226,59,59,.55), 0 4px 0 rgba(0,0,0,.7); }
  .tag { color:#C9C3B6; border-color:#5A544C; box-shadow:none; background:rgba(10,10,12,.7); }
  .tag.red { color:var(--red); border-color:var(--red); box-shadow:0 0 24px rgba(226,59,59,.3); }
  .quote { background:rgba(12,10,10,.88); border-color:#3A3430; font-family:"Marck Script"; font-weight:400; font-size:86px; line-height:1.1; color:#E8E0D0; }
  .quote.red { color:#E23B3B; }
  #vign { position:absolute; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.92) 100%); }
  #flick { position:absolute; inset:0; z-index:41; background:#000; opacity:0; pointer-events:none; }
  .rec { display:flex; justify-content:space-between; padding:26px 32px; margin-bottom:14px; border-radius:18px; background:#101219; border:3px solid #2A2D38;
         font:700 36px/1 "JetBrains Mono"; color:#C9C3B6; white-space:nowrap; }
  .rec b { color:#E23B3B; font-weight:700; }
</style>
</head>
<body>
<div id="stage" data-width="1080" data-height="1920" data-fps="30" data-duration="52.4" data-safe="none" data-sfx="02">
  <div class="bg" data-bg></div>

  <!-- радионяня: общий рисунок для сцен A, C, F -->
  <svg width="0" height="0" style="position:absolute"><defs>
    <g id="monitor">
      <rect x="-170" y="-260" width="340" height="520" rx="70" fill="#E9E4DA"/>
      <rect x="-130" y="-200" width="260" height="170" rx="30" fill="#1A1C22"/>
      <g fill="#9A958A"><circle cx="-60" cy="60" r="10"/><circle cx="-30" cy="60" r="10"/><circle cx="0" cy="60" r="10"/><circle cx="30" cy="60" r="10"/><circle cx="60" cy="60" r="10"/>
        <circle cx="-45" cy="95" r="10"/><circle cx="-15" cy="95" r="10"/><circle cx="15" cy="95" r="10"/><circle cx="45" cy="95" r="10"/></g>
      <rect x="-14" y="-330" width="28" height="90" rx="14" fill="#D9D3C6"/>
    </g>
  </defs></svg>

  <!-- A. Хук: радионяня в темноте -->
  <section class="scene" id="sA">
    <svg class="art" viewBox="0 0 1080 1920"><defs><radialGradient id="gA"><stop offset="0" stop-color="#3A4A3A" stop-opacity=".6"/><stop offset="1" stop-color="#3A4A3A" stop-opacity="0"/></radialGradient></defs>
      <rect width="1080" height="1920" fill="#030304"/><circle cx="540" cy="900" r="600" fill="url(#gA)"/>
      <g transform="translate(540,920) scale(1.4)"><use href="#monitor"/><g id="ledA"></g></g></svg>
  </section>

  <!-- B. Кухня ночью -->
  <section class="scene" id="sB">
    <svg class="art" viewBox="0 0 1080 1920">
      <defs><linearGradient id="moonB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9CB4D6" stop-opacity=".35"/><stop offset="1" stop-color="#9CB4D6" stop-opacity="0"/></linearGradient></defs>
      <rect width="1080" height="1920" fill="#0A0C10"/>
      <rect x="640" y="300" width="300" height="420" fill="#1A2233" stroke="#22262E" stroke-width="16"/><line x1="790" y1="300" x2="790" y2="720" stroke="#22262E" stroke-width="10"/><line x1="640" y1="510" x2="940" y2="510" stroke="#22262E" stroke-width="10"/>
      <polygon points="640,720 940,720 700,1400 120,1400" fill="url(#moonB)"/>
      <rect x="80" y="1300" width="920" height="40" fill="#1E1A16"/><rect x="120" y="1340" width="30" height="400" fill="#16130F"/><rect x="930" y="1340" width="30" height="400" fill="#16130F"/>
      <g transform="translate(560,1180) scale(.42)"><use href="#monitor"/></g>
      <circle id="ledB" cx="560" cy="1100" r="7" fill="#3DBE6E"/>
      <g fill="#0E1014"><polygon points="0,1920 0,700 120,700 120,820 240,820 240,940 360,940 360,1060 0,1060"/></g>
    </svg>
    <div class="tag" data-small id="bTag" style="top:200px"><i></i>23:10 · КУХНЯ</div>
  </section>

  <!-- C. 2:00, колыбельная -->
  <section class="scene" id="sC">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#040405"/>
      <g transform="translate(540,1000) scale(1.1)"><use href="#monitor"/></g>
      <g id="barsC" fill="#3DBE6E"></g>
      <g id="notes" fill="#E8E0D0"></g></svg>
    <div class="big" id="cClock" style="top:230px;font-size:160px;font-family:'JetBrains Mono';color:#E23B3B;text-shadow:0 0 40px rgba(226,59,59,.5)">02:00</div>
    <div class="quote" id="cQ" style="top:1460px;text-align:center">«Баю-баюшки-баю…»</div>
    <div class="tag red" data-small id="cHome" style="top:500px"><i></i>В ДОМЕ: ИРА И СЫН</div>
  </section>

  <!-- E. Лестница вверх и детская -->
  <section class="scene" id="sE">
    <svg class="art" viewBox="0 0 1080 1920">
      <defs><radialGradient id="nl"><stop offset="0" stop-color="#5C6E9A" stop-opacity=".5"/><stop offset="1" stop-color="#5C6E9A" stop-opacity="0"/></radialGradient></defs>
      <rect width="1080" height="1920" fill="#08090C"/>
      <g id="stairs" stroke="#1E2129" stroke-width="14"></g>
      <g id="nursery" opacity="0">
        <rect width="1080" height="1920" fill="#0B0D12"/>
        <circle cx="540" cy="1000" r="560" fill="url(#nl)"/>
        <rect x="660" y="320" width="280" height="380" fill="#141C2C" stroke="#20242C" stroke-width="16"/><rect x="785" y="500" width="30" height="20" fill="#9A958A"/>
        <rect x="240" y="1000" width="600" height="380" rx="20" fill="none" stroke="#C9C3B6" stroke-width="10"/>
        <g stroke="#C9C3B6" stroke-width="8"><line x1="300" y1="1000" x2="300" y2="1380"/><line x1="380" y1="1000" x2="380" y2="1380"/><line x1="460" y1="1000" x2="460" y2="1380"/><line x1="540" y1="1000" x2="540" y2="1380"/><line x1="620" y1="1000" x2="620" y2="1380"/><line x1="700" y1="1000" x2="700" y2="1380"/><line x1="780" y1="1000" x2="780" y2="1380"/></g>
        <ellipse cx="540" cy="1260" rx="200" ry="60" fill="#2A3040"/><circle cx="400" cy="1230" r="40" fill="#3A3E4A"/>
        <rect x="240" y="1380" width="20" height="160" fill="#C9C3B6"/><rect x="820" y="1380" width="20" height="160" fill="#C9C3B6"/>
      </g>
    </svg>
    <div class="tag" data-small id="eWin" style="top:760px;left:640px"><i></i>ОКНО ЗАКРЫТО</div>
    <div class="tag red" data-small id="eEmpty" style="top:250px"><i></i>В КОМНАТЕ ПУСТО</div>
  </section>

  <!-- F. Внизу: радионяня снова, шёпот -->
  <section class="scene" id="sF">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#030304"/>
      <g id="monF" transform="translate(540,1000) scale(1.1)"><use href="#monitor"/></g>
      <g id="barsF" fill="#E23B3B"></g></svg>
    <div class="quote red" id="fQ" style="top:330px;text-align:center">«Мама ушла. Спи»</div>
  </section>

  <!-- G. Утро: записи каждую ночь -->
  <section class="scene" id="sG">
    <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0B0C10"/></svg>
    <div class="tag" data-small id="gTag" style="top:200px"><i></i>ЗАПИСИ РАДИОНЯНИ</div>
    <div id="list" style="position:absolute;left:110px;right:110px;top:320px;height:1180px;overflow:hidden"><div id="listIn"></div></div>
    <div class="big" id="g30" style="top:1500px;font-size:110px;color:#E23B3B">30 ночей</div>
  </section>

  <!-- H. Финал: кроватка и тень у неё -->
  <section class="scene" id="sH">
    <svg class="art" viewBox="0 0 1080 1920">
      <defs><radialGradient id="nlH"><stop offset="0" stop-color="#5C6E9A" stop-opacity=".45"/><stop offset="1" stop-color="#5C6E9A" stop-opacity="0"/></radialGradient></defs>
      <rect width="1080" height="1920" fill="#07080B"/><circle cx="540" cy="1100" r="560" fill="url(#nlH)"/>
      <path id="shadow" d="M760,1500 L770,820 Q760,700 700,660 Q720,560 680,520 Q620,500 610,580 Q600,640 640,690 Q600,760 600,900 Q560,980 520,1040 L540,1060 Q600,1000 640,960 L650,1500 Z" fill="#000" opacity="0"/>
      <rect x="240" y="1000" width="600" height="380" rx="20" fill="none" stroke="#9A958A" stroke-width="10"/>
      <g stroke="#9A958A" stroke-width="8"><line x1="300" y1="1000" x2="300" y2="1380"/><line x1="380" y1="1000" x2="380" y2="1380"/><line x1="460" y1="1000" x2="460" y2="1380"/><line x1="540" y1="1000" x2="540" y2="1380"/><line x1="620" y1="1000" x2="620" y2="1380"/><line x1="700" y1="1000" x2="700" y2="1380"/><line x1="780" y1="1000" x2="780" y2="1380"/></g>
      <ellipse cx="540" cy="1260" rx="200" ry="60" fill="#2A3040"/><circle cx="400" cy="1230" r="40" fill="#3A3E4A"/>
    </svg>
  </section>

  <div id="cap"></div>
  <div id="vign"></div>
  <div id="flick"></div>
</div>
<audio src="media/voice.mp3" data-at="0" data-voice></audio>
<script src="lib/gsap.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<script src="lib/MotionPathPlugin.min.js"></script>
<script src="lib/MorphSVGPlugin.min.js"></script>
<script src="motion.js"></script>
<script src="data.js"></script>
<script src="caps.js"></script>
<script>
M.start(({ tl, D }) => {
  const R = M.rand(71), W = M.data.words.s9;
  const nrm = s => s.toLowerCase().replace(/[^а-яё0-9]/g, '');
  const wt = (s, n = 1, end) => { let k = 0; for (const w of W) if ((nrm(s).length <= 3 ? nrm(w.w) === nrm(s) : nrm(w.w).startsWith(nrm(s))) && ++k === n) return end ? w.e : w.s; console.warn('нет слова', s); return 0; };
  const T = { B: wt('ира') - .3, C: wt('часа') - .9, E: wt('взлетела') - .5, F: wt('выдохнула') - .5, G: wt('утром') - .3, H: wt('последнее') - .9 };
  xfade(tl, [['#sA',0],['#sB',T.B],['#sC',T.C],['#sE',T.E],['#sF',T.F],['#sG',T.G],['#sH',T.H]], D, .45);
  captions(W, { k1: [], k2: [], k3: ['голос…','голос','не','доме?','колыбельная.','женский','никого','пусто.','ожила.','шептал.','ушла.','спи».','спи','каждую','месяц.','быстро.'], k4: [] });

  M.onFrame(t => { const f = document.querySelector('#flick'); let o = 0;
    for (const a of [T.C, T.E, T.F, T.H]) if (t > a - .05 && t < a + .45) o = Math.max(o, (Math.sin((t - a) * 90) > 0 ? .85 : .15) * (1 - (t - a + .05) / .5));
    f.style.opacity = o; });
  for (const s of [0, T.B, T.C, T.E, T.F, T.G, T.H]) M.sfx('swell', s + .1, { gain: -10, rate: .6 });

  // LED-полоски радионяни
  const leds = (sel, x, y, n, colorFn, levelFn) => { const g = document.querySelector(sel), L = [];
    for (let i = 0; i < n; i++) L.push(mk(g, 'rect', { x: x + i * 26, y, width: 18, height: 30, rx: 6 }));
    M.onFrame(t => { const lv = levelFn(t); L.forEach((r, i) => { const on = i < lv * n; r.setAttribute('fill', on ? colorFn(i / n) : '#22252C'); }); }); };
  const hiss = t => .1 + .08 * Math.abs(Math.sin(t * 13) * Math.sin(t * 7.3));
  leds('#ledA', -110, -150, 9, k => k > .7 ? '#E23B3B' : '#3DBE6E', t => t < wt('голос') ? hiss(t) : .3 + .6 * Math.abs(Math.sin(t * 5)));
  tl.fromTo('#sA svg.art', { scale: 1.25, transformOrigin: '50% 48%' }, { scale: 1, duration: T.B, ease: 'power2.out' }, 0);
  M.hit(wt('доме'), 's');

  // B
  M.show('#bTag', { at: T.B + .3, in: 'fade', dur: .6 });
  M.onFrame(t => document.querySelector('#ledB').setAttribute('opacity', .5 + .5 * Math.sin(t * 3)));
  tl.to('#sB svg.art', { scale: 1.15, transformOrigin: '52% 62%', duration: T.C - T.B, ease: 'none' }, T.B);

  // C — колыбельная
  M.show('#cClock', { at: wt('часа') - .6, in: 'blur', dur: .6 });
  const sing = [wt('зазвучала'), wt('ира', 2) - .3];
  const bc = document.querySelector('#barsC'), BC = [];
  for (let i = 0; i < 30; i++) BC.push(mk(bc, 'rect', { x: 150 + i * 26, y: 700, width: 14, height: 4, rx: 6 }));
  M.onFrame(t => BC.forEach((b, i) => { const live = t > sing[0] && t < sing[1]; const h = live ? 6 + (Math.sin(t * 2.2 + i * .35) * .5 + .5) * 140 * (Math.sin(t * 1.1) * .3 + .7) : 3; b.setAttribute('height', h); b.setAttribute('y', 640 - h / 2); }));
  const nt = document.querySelector('#notes');
  for (let i = 0; i < 6; i++) { const n = mk(nt, 'g', { opacity: 0 }); mk(n, 'ellipse', { cx: 0, cy: 0, rx: 16, ry: 12 }); mk(n, 'rect', { x: 12, y: -60, width: 5, height: 60 });
    const t0 = sing[0] + i * 1.1, x = 300 + R() * 480; tl.fromTo(n, { x, y: 900 }, { x: x + (R() - .5) * 120, y: 520, duration: 2.6, ease: 'none' }, t0); tl.to(n, { opacity: .8, duration: .5 }, t0); tl.to(n, { opacity: 0, duration: .6 }, t0 + 2); }
  M.show('#cQ', { at: wt('баю') - .2, in: 'blur', dur: 1 });
  M.hide('#cQ', { at: wt('замерла') - .3, out: 'fade', dur: .5 });
  M.show('#cHome', { at: wt('кроме') - .1, in: 'pop', dur: .45 }); M.hit(wt('никого'), 'm');

  // E — лестница и детская
  const st = document.querySelector('#stairs'), SL = [];
  for (let i = 0; i < 14; i++) SL.push(mk(st, 'line', { x1: 120, x2: 960 }));
  M.onFrame(t => SL.forEach((l, i) => { const y = ((i * 150 + (t - T.E) * 1200) % 2100) - 100; l.setAttribute('y1', y); l.setAttribute('y2', y); }));
  for (let i = 0; i < 8; i++) M.sfx('thud', T.E + .2 + i * .17, { gain: -12, rate: 1.4 });
  tl.to('#nursery', { opacity: 1, duration: .4 }, wt('спал') - .3);
  M.show('#eWin', { at: wt('окно') - .05, in: 'pop', dur: .45 });
  M.show('#eEmpty', { at: wt('комнате') - .05, in: 'pop', dur: .45 });
  tl.to('#sE svg.art', { scale: 1.1, transformOrigin: '50% 60%', duration: T.F - wt('спал'), ease: 'none' }, wt('спал'));

  // F — шёпот
  const bf = document.querySelector('#barsF'), BF = [];
  for (let i = 0; i < 30; i++) BF.push(mk(bf, 'rect', { x: 150 + i * 26, y: 1600, width: 14, height: 4, rx: 6 }));
  const live2 = [wt('ожила') - .2, wt('утром') - .5];
  M.onFrame(t => BF.forEach((b, i) => { const live = t > live2[0] && t < live2[1]; const h = live ? 4 + Math.abs(Math.sin(t * 8 + i * .7)) * 70 * Math.exp(-Math.abs(i - 15) / 7) : 3; b.setAttribute('height', h); b.setAttribute('y', 1600 - h / 2); }));
  M.shake('#monF', { at: wt('ожила'), amp: 6, dur: .5, sfx: false }); M.sfx('glitch', wt('ожила'), { gain: -8 });
  M.show('#fQ', { at: wt('ушла') - .5, in: 'blur', dur: 1 }); M.hit(wt('спи'), 'l');
  tl.to('#sF svg.art', { scale: 1.18, transformOrigin: '50% 50%', duration: T.G - T.F, ease: 'power1.in' }, T.F);

  // G — записи
  const li = document.querySelector('#listIn');
  for (let d = 30; d >= 1; d--) { const r = document.createElement('div'); r.className = 'rec'; r.innerHTML = `<span>${String(d).padStart(2, '0')}.10 · 02:00</span><b>колыбельная</b>`; li.appendChild(r); }
  tl.fromTo('#listIn', { y: 0 }, { y: -2200, duration: 3.2, ease: 'power2.inOut' }, wt('каждую') - .3);
  M.show('#gTag', { at: T.G + .3, in: 'fade', dur: .5 });
  M.show('#g30', { at: wt('месяц') - .2, in: 'blur', dur: .6 }); M.hit(wt('месяц'), 'm');
  M.ticks(wt('каждую'), { n: 14, gap: .12, rise: false });

  // H — тень у кроватки
  tl.to('#shadow', { opacity: .95, duration: 3, ease: 'power1.in' }, T.H + .6);
  tl.to('#sH svg.art', { scale: 1.12, transformOrigin: '60% 55%', duration: D - T.H - .4, ease: 'none' }, T.H);
  M.hit(wt('быстро'), 'l');
  M.grain(0.16);
});
</script>
</body>
</html>
